name: Content Validation

on:
  push:
    paths:
      - 'data/captions/**'
      - 'data/categories.json'
      - 'scripts/validate-captions.js'
  pull_request:
    paths:
      - 'data/captions/**'
      - 'data/categories.json'
      - 'scripts/validate-captions.js'
  workflow_dispatch:

jobs:
  validate:
    name: Validate caption dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run caption validation
        run: node scripts/validate-captions.js
